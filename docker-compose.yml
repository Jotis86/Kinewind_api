services:
  db:
    image: postgres:16-alpine
    container_name: kinewind_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - kinewind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: kinewind_web
    restart: unless-stopped
    command: >
      sh -c "/app/.venv/bin/python manage.py migrate &&
             /app/.venv/bin/python manage.py seed &&
             /app/.venv/bin/python manage.py collectstatic --noinput &&
             /app/.venv/bin/gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers ${WEB_CONCURRENCY}
               --timeout ${WEB_TIMEOUT}
               --access-logfile -"
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  kinewind_pgdata:
